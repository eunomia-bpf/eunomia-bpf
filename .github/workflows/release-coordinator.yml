name: Resolve release tag

on:
  workflow_call:
    inputs:
      create_release:
        required: true
        type: boolean
    outputs:
      version:
        description: Resolved release tag
        value: ${{ jobs.resolve.outputs.version }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Keyed by commit, not by branch: ecc-binary.yml and ecli-binary.yaml both
    # call this job for the same push, and they must not cancel each other.
    # A branch-keyed group put every push in one queue, so a second push
    # cancelled the first one's pending resolve -- ecc's assets were never
    # uploaded and ecli's publish-release waited out its 30 minutes and failed.
    # Two runs for the same commit still serialize, which is what makes the
    # "reuse the release the other workflow created" path below deterministic.
    concurrency:
      group: release-tag-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.resolve.outputs.result }}
    steps:
      - name: Resolve release tag
        id: resolve
        uses: actions/github-script@v6
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
        with:
          result-encoding: string
          script: |
            const versionPattern = /^v(\d+)\.(\d+)\.(\d+)$/;

            function parseVersion(version) {
              const match = versionPattern.exec(version);
              if (!match) {
                return null;
              }
              return match.slice(1).map(Number);
            }

            function compareVersions(a, b) {
              for (let i = 0; i < a.length; i += 1) {
                if (a[i] !== b[i]) {
                  return a[i] - b[i];
                }
              }
              return 0;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const matchingRelease = releases
              .filter(release => release.target_commitish === context.sha)
              .filter(release => versionPattern.test(release.tag_name))
              .map(release => ({
                tag: release.tag_name,
                version: parseVersion(release.tag_name),
              }))
              .sort((a, b) => compareVersions(a.version, b.version))
              .at(-1);

            if (matchingRelease) {
              core.info(`Reusing existing release tag ${matchingRelease.tag} for ${context.sha}`);
              return matchingRelease.tag;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });

            const versions = [...releases.map(release => release.tag_name), ...tags.map(tag => tag.name)]
              .map(parseVersion)
              .filter(Boolean)
              .sort(compareVersions);

            const nextTag = versions.length === 0
              ? "v0.0.1"
              : (() => {
                  const [major, minor, patch] = versions[versions.length - 1];
                  return `v${major}.${minor}.${patch + 1}`;
                })();

            if (process.env.CREATE_RELEASE !== 'true') {
              core.info(`Resolved non-release build tag ${nextTag}`);
              return nextTag;
            }

            // Separate pushes to master resolve concurrently, so a tag can be
            // taken between the listing above and the create below. Losing that
            // race is normal: step to the next patch number and try again
            // instead of failing the release for the commit that lost it.
            let tagToCreate = nextTag;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              try {
                const created = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagToCreate,
                  draft: true,
                  generate_release_notes: true,
                  target_commitish: context.sha,
                });
                core.info(`Created draft release ${created.data.tag_name} for ${context.sha}`);
                return created.data.tag_name;
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }

              let takenBy = "another commit";
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: tagToCreate,
                });
                if (existing.data.target_commitish === context.sha) {
                  core.info(`Reusing concurrently created release ${existing.data.tag_name} for ${context.sha}`);
                  return existing.data.tag_name;
                }
                takenBy = existing.data.target_commitish;
              } catch (lookupError) {
                if (lookupError.status !== 404) {
                  throw lookupError;
                }
              }

              const [major, minor, patch] = parseVersion(tagToCreate);
              tagToCreate = `v${major}.${minor}.${patch + 1}`;
              core.info(`Tag was taken by ${takenBy}; trying ${tagToCreate}`);
            }

            core.setFailed(`Could not create a release tag for ${context.sha}`);
            return "";

