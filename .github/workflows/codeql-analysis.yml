# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '19 6 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
    # Initializes the CodeQL tools for scanning.
    #
    # The build output goes outside the checkout. `make` builds `ecli`, whose
    # `openssl-sys` unpacks and compiles OpenSSL under `ecli/target/`; the
    # extractor then reports 65 findings in that vendored copy (47
    # weak-crypto-algorithm, 8 use-after-free, 8
    # integer-multiplication-cast-to-long), none of it code in this repository
    # — `git ls-files '*/target/*'` is empty.
    #
    # `CARGO_TARGET_DIR` moves every crate's output to one directory beside the
    # checkout, so the analysis sees only tracked sources. The CodeQL config
    # additionally ignores `node_modules/`.
    #
    # The build step itself is required: without it extraction finds no
    # sources and database finalize fails with "could not process any of it"
    # (run of #417, 2026-11-21).
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Build code for CodeQL
      run: make
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/../codeql-build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"
