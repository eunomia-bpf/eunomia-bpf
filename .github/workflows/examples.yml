# Simple workflow for deploying static content to GitHub Pages
name: Test bpftools examples

on:
  pull_request:
    branches: "*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: install deps
        run: |
             sudo make -C bpf-loader-rs install-deps

      - name: install test deps
        run:  |
              make -C examples/tests install-deps
              make -C examples/tests install-wasm-clang

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      - name: test build runners
        run:  |
              make -C examples

      - name: test examples
        run:  |
              # The hosted runner kernel does not carry every function the
              # tracing examples attach to: `fentry-link` resolves
              # `do_unlinkat` by BTF type id and fails with -ESRCH, and
              # `kprobe-link` fails to create its perf event on the same name
              # with -ENOENT (issue #409). Skip only those two cases so the
              # rest of the matrix still runs; re-add them once the examples
              # target a function the runner kernel keeps in BTF and kallsyms.
              SKIP_TESTS='profile fentry-link kprobe-link' make -C examples/tests test

  examples-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: install deps
        run: |
             sudo make -C bpf-loader-rs install-deps

      - name: install test deps
        run:  |
              make -C examples/tests install-deps
              make -C examples/tests install-wasm-clang

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: test build runners
        run:  |
              make -C examples

      - name: test supported arm64 examples
        run:  |
              # The hosted arm64 runner kernel does not expose every tracing hook
              # that the full example matrix expects. Keep the allowlist explicit
              # and expand it only after each example passes on the official arm64
              # runner. `opensnoop` is currently excluded because the runner
              # kernel lacks the expected syscalls/sys_enter_open tracepoint;
              # `fentry-link` and `kprobe-link` are excluded because the runner
              # kernel no longer keeps `do_unlinkat` in BTF or kallsyms (issue
              # #409): fentry resolves it by type id and fails with -ESRCH, the
              # kprobe fails to create its perf event with -ENOENT.
              make -C examples/tests \
                TEST_CASES_DIRS='bashreadline bootstrap lsm-connect mdflush minimal runqlat sigsnoop tc tcpstates xdp' \
                test
